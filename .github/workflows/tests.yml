name: tests
# Rule 17: a commit's checks run once: on pull requests, and on pushes only to main and a release branch
# (release-x.y.z; a release-sync-N branch is checked on its pull request only).
on:
  pull_request:
  push:
    branches: [main, "release-[0-9]*"]
# Rule 17: a newer push to a pull request cancels that pull request's older runs; never on main or a release branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# This repository is public: its jobs run on GitHub's standard runners only, never on a self-hosted one
# (tests/test_strand.py checks every runs-on line).
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          for t in tests/test_*.py; do python "$t" -v || exit 1; done
  release-place:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install words live only on a release branch, and it differs from main only in README, changelog and manifest
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH" in
            release-*)
              git fetch -q origin main
              other=$(git diff --name-only origin/main HEAD | grep -vxE 'README\.md|CHANGELOG\.md|\.claude-plugin/plugin\.json' || true)
              if [ -n "$other" ]; then echo "::error::$BRANCH differs from main outside README, changelog and manifest:"; echo "$other"; exit 1; fi
              echo "ok $BRANCH differs from main only in: $(git diff --name-only origin/main HEAD | tr '\n' ' ')" ;;
            *)
              # Before a release, install lines live on the release branch only (rule 15). After it, main's README
              # may carry them, every clone pinned to a version tag that exists here (rule 16: never main).
              if ! grep -qE 'git clone|minions\.py (look|setup|move)' README.md; then echo "ok README on $BRANCH has no install lines"; exit 0; fi
              git fetch -q --tags origin 2>/dev/null || true
              clones=$(grep -cE 'git clone' README.md || true)
              pinned=$(grep -cE 'git clone --branch v[0-9]+\.[0-9]+\.[0-9]+ https://github\.com/TheWindstorm/windstorm-repo-minions' README.md || true)
              tags=$(grep -oE 'git clone --branch v[0-9]+\.[0-9]+\.[0-9]+ ' README.md | awk '{print $4}' | sort -u)
              if [ "$clones" = 0 ] || [ "$clones" != "$pinned" ]; then
                grep -nE 'git clone|minions\.py (look|setup|move)' README.md
                echo "::error::README on $BRANCH carries install lines; on main every clone names a released version tag (--branch vX.Y.Z)"; exit 1
              fi
              for t in $tags; do
                if ! git rev-parse -q --verify "refs/tags/$t" >/dev/null; then echo "::error::README on $BRANCH clones $t, which is not a tag of this repository yet"; exit 1; fi
              done
              echo "ok README on $BRANCH carries install lines pinned to released tags: $(echo $tags)" ;;
          esac
  skill-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every SKILL.md loads in a strict YAML parser and fits the Agent Skills limits
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, os, yaml
          skills = glob.glob("skills/*/SKILL.md")
          for p in skills:
              t = open(p, encoding="utf-8").read()
              d = yaml.safe_load(t.split("---", 2)[1])
              assert isinstance(d, dict) and d.get("name") and d.get("description"), p
              assert len(d["name"]) <= 64 and len(d["description"]) <= 1024, (p, len(d["description"]))
              assert len(t.splitlines()) < 500, p
              print("ok", p, len(d["description"]), "chars")
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              if os.path.exists(p):
                  json.load(open(p)); print("ok", p)
          if not skills:
              print("no skill yet: nothing to check (the skill comes after the plan)")
          PY
      - name: Agent Skills validator (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls skills/*/SKILL.md >/dev/null 2>&1; then
            echo "no skill yet: the validator runs from the first pull request that adds one"
          elif gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "::error::this runner's gh has no 'skill' command, so the Agent Skills validator did not run (rule: it is a gate, never a warning)"
            exit 1
          fi
