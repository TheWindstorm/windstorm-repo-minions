name: tests
on: [push, pull_request]
permissions:
  contents: read
# This repository is public: its jobs run on GitHub's standard runners only, never on a self-hosted one
# (tests/test_strand.py checks every runs-on line).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          for t in tests/test_*.py; do python "$t" -v || exit 1; done
  release-place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install words live only on a release branch, and it differs from main only in README, changelog and manifest
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH" in
            release-*)
              git fetch -q origin main
              other=$(git diff --name-only origin/main HEAD | grep -vxE 'README\.md|CHANGELOG\.md|\.claude-plugin/plugin\.json' || true)
              if [ -n "$other" ]; then echo "::error::$BRANCH differs from main outside README, changelog and manifest:"; echo "$other"; exit 1; fi
              echo "ok $BRANCH differs from main only in: $(git diff --name-only origin/main HEAD | tr '\n' ' ')" ;;
            *)
              if grep -nE 'git clone|minions\.py (look|setup|move)' README.md; then
                echo "::error::README on $BRANCH carries install lines; before a release they live on the release branch only"; exit 1
              fi
              echo "ok README on $BRANCH has no install lines" ;;
          esac
  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every SKILL.md loads in a strict YAML parser and fits the Agent Skills limits
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, os, yaml
          skills = glob.glob("skills/*/SKILL.md")
          for p in skills:
              t = open(p, encoding="utf-8").read()
              d = yaml.safe_load(t.split("---", 2)[1])
              assert isinstance(d, dict) and d.get("name") and d.get("description"), p
              assert len(d["name"]) <= 64 and len(d["description"]) <= 1024, (p, len(d["description"]))
              assert len(t.splitlines()) < 500, p
              print("ok", p, len(d["description"]), "chars")
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              if os.path.exists(p):
                  json.load(open(p)); print("ok", p)
          if not skills:
              print("no skill yet: nothing to check (the skill comes after the plan)")
          PY
      - name: Agent Skills validator (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls skills/*/SKILL.md >/dev/null 2>&1; then
            echo "no skill yet: the validator runs from the first pull request that adds one"
          elif gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "::warning::this runner's gh has no 'skill' command; the strict YAML step above still ran"
          fi
