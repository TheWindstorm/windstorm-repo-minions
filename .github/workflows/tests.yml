name: tests
# Rule 17: a commit's checks run once: on pull requests, and on pushes only to main and a release branch
# (release-x.y.z; a release-sync-N branch is checked on its pull request only).
on:
  pull_request:
  push:
    branches: [main, "release-[0-9]*"]
# Rule 17: a newer push to a pull request cancels that pull request's older runs; never on main or a release branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# This repository is public: its jobs run on GitHub's standard runners only, never on a self-hosted one
# (tests/test_strand.py checks every runs-on line).
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          # R169 (the gate recipe's ninth case): a test process that ends early with exit 0 (os._exit, a parent
          # leaving after a fork) writes no summary: green only with each file's own "Ran" and "OK" lines, and the
          # gate's own last line, which it writes only after its whole run has ended
          set -o pipefail
          for t in tests/test_*.py; do
            log="$RUNNER_TEMP/$(basename "$t").log"
            python "$t" -v 2>&1 | tee "$log" || exit 1
            grep -qE '^Ran [0-9]+ tests? in ' "$log" && grep -qE '^OK( \(.*\))?$' "$log" || { echo "::error::$t ended without its runner's summary: a run that ends early is not a pass"; exit 1; }
          done
          tail -n 1 "$RUNNER_TEMP/test_strand.py.log" | grep -qE '^gate: passed: ' || { echo "::error::the gate's own last line is not there: it did not run to its end"; exit 1; }
  release-place:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install words live only on a release branch, and it differs from main only in README, changelog, manifest and the lines that name its version
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH" in
            release-*)
              # The maintainer's ruling of 2026-11-27: a release line differs from main only in what names the version,
              # never in what the tool does. Beside the README, the changelog and the manifest, two files may differ by
              # one line each: the tool's VERSION line and the skill's clone line, each naming this branch's version.
              ver=${BRANCH#release-}
              if ! printf '%s\n' "$ver" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then echo "::error::$BRANCH does not name a version (release-X.Y.Z), so it is refused"; exit 1; fi
              vre=$(printf '%s' "$ver" | sed 's/\./\\./g')
              if ! git fetch -q origin main; then echo "::error::main could not be read, so $BRANCH is refused"; exit 1; fi
              if ! raw=$(git diff --raw --no-renames origin/main HEAD); then echo "::error::the difference from main could not be read, so $BRANCH is refused"; exit 1; fi
              bad=0
              # one changed line of a file, as "old<TAB>new"; anything else is said and refused
              one_line() {
                local d n_old n_new
                if ! d=$(git diff --no-renames --no-color -U0 origin/main HEAD -- "$1"); then echo "::error::$1: the difference from main could not be read" >&2; return 1; fi
                n_old=$(printf '%s\n' "$d" | awk '/^@@/{h=1; next} h && /^-/' | wc -l)
                n_new=$(printf '%s\n' "$d" | awk '/^@@/{h=1; next} h && /^\+/' | wc -l)
                if [ "$n_old" -ne 1 ] || [ "$n_new" -ne 1 ]; then { printf '%s\n' "$d" | awk '/^@@/{h=1} h'; echo "::error::$1 differs from main in more than its one version line"; } >&2; return 1; fi
                printf '%s\t%s\n' "$(printf '%s\n' "$d" | awk '/^@@/{h=1; next} h && /^-/{print substr($0, 2)}')" "$(printf '%s\n' "$d" | awk '/^@@/{h=1; next} h && /^\+/{print substr($0, 2)}')"
              }
              while IFS= read -r x; do
                [ -n "$x" ] || continue
                meta=${x%%$'\t'*}; f=${x#*$'\t'}
                set -- $meta; om=${1#:}; nm=$2; st=$5
                if [ "$st" != M ] && ! { [ "$st" = A ] && [ "$f" = .claude-plugin/plugin.json ]; }; then echo "::error::$f is $([ "$st" = D ] && echo deleted || echo "changed in kind ($st)") on $BRANCH; a release line only edits what names its version"; bad=1; continue; fi
                if [ "$st" = M ] && [ "$om" != "$nm" ]; then echo "::error::$f changed its mode ($om to $nm) on $BRANCH"; bad=1; continue; fi
                case "$f" in
                  README.md|CHANGELOG.md|.claude-plugin/plugin.json) ;;
                  scripts/minions.py)
                    if ! pair=$(one_line "$f"); then bad=1; continue; fi
                    o=${pair%%$'\t'*}; n=${pair#*$'\t'}
                    if ! printf '%s\n' "$o" | grep -qxE 'VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' || ! printf '%s\n' "$n" | grep -qxE "VERSION = \"$vre\""; then
                      echo "-$o"; echo "+$n"; echo "::error::$f: its one changed line is not the tool's VERSION line naming $ver, and nothing else"; bad=1; fi ;;
                  skills/repo-minions/SKILL.md)
                    if ! pair=$(one_line "$f"); then bad=1; continue; fi
                    o=${pair%%$'\t'*}; n=${pair#*$'\t'}
                    on=$(printf '%s\n' "$o" | sed -E 's/--branch v[0-9]+\.[0-9]+\.[0-9]+([^0-9.]|$)/--branch v@\1/g')
                    nn=$(printf '%s\n' "$n" | sed -E "s/--branch v$vre([^0-9.]|\$)/--branch v@\\1/g")
                    if [ "$nn" = "$n" ] || [ "$on" != "$nn" ]; then
                      echo "-$o"; echo "+$n"; echo "::error::$f: its one changed line differs from main's in more than the clone's --branch v$ver"; bad=1; fi ;;
                  *) echo "::error::$f differs from main on $BRANCH; a release line differs only in README, changelog, manifest and the lines that name its version"; bad=1 ;;
                esac
              done <<< "$raw"
              # its clones name the tag, never the branch (the README that is tagged)
              if grep -qE 'git clone' README.md; then
                clones=$({ grep -oE 'git clone' README.md || true; } | wc -l)
                pinned=$({ grep -oE "git clone --branch v$vre https://github\.com/TheWindstorm/windstorm-repo-minions(\.git)?([^A-Za-z0-9_.-]|\$)" README.md || true; } | wc -l)
                if [ "$clones" -ne "$pinned" ]; then grep -nE 'git clone' README.md; echo "::error::README on $BRANCH: every clone names this version's tag (--branch v$ver)"; bad=1; fi
              fi
              [ "$bad" = 0 ] || exit 1
              echo "ok $BRANCH differs from main only in: $(git diff --name-only origin/main HEAD | tr '\n' ' ')" ;;
            *)
              # Before a release, install lines live on the release branch only (rule 15). After it, main's README
              # may carry them, every clone pinned to a version tag that exists here (rule 16: never main).
              if ! grep -qE 'git clone|minions\.py (look|setup|move)' README.md; then echo "ok README on $BRANCH has no install lines"; exit 0; fi
              # Each clone is counted, not each line (R194: two on one line were one), and a pinned one is of this
              # repository only: an optional .git, then no character a repository's name can hold.
              clones=$({ grep -oE 'git clone' README.md || true; } | wc -l)
              pinned=$({ grep -oE 'git clone --branch v[0-9]+\.[0-9]+\.[0-9]+ https://github\.com/TheWindstorm/windstorm-repo-minions(\.git)?([^A-Za-z0-9_.-]|$)' README.md || true; } | wc -l)
              tags=$(grep -oE 'git clone --branch v[0-9]+\.[0-9]+\.[0-9]+ ' README.md | awk '{print $4}' | sort -u)
              if [ "$clones" -eq 0 ] || [ "$clones" -ne "$pinned" ]; then
                grep -nE 'git clone|minions\.py (look|setup|move)' README.md
                echo "::error::README on $BRANCH carries install lines; on main every clone names a released version tag (--branch vX.Y.Z)"; exit 1
              fi
              # Rule 6: each tag is read from this repository on GitHub: there, not there, or could not be read.
              for t in $tags; do
                if ! seen=$(git ls-remote --tags origin "refs/tags/$t"); then echo "::error::README on $BRANCH clones $t; this repository's tags could not be read, so it is refused"; exit 1; fi
                if [ -z "$seen" ]; then echo "::error::README on $BRANCH clones $t, which is not a tag of this repository yet"; exit 1; fi
              done
              echo "ok README on $BRANCH carries install lines pinned to released tags: $(echo $tags)" ;;
          esac
  skill-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every SKILL.md loads in a strict YAML parser and fits the Agent Skills limits
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, os, yaml
          skills = glob.glob("skills/*/SKILL.md")
          for p in skills:
              t = open(p, encoding="utf-8").read()
              d = yaml.safe_load(t.split("---", 2)[1])
              assert isinstance(d, dict) and d.get("name") and d.get("description"), p
              assert len(d["name"]) <= 64 and len(d["description"]) <= 1024, (p, len(d["description"]))
              assert len(t.splitlines()) < 500, p
              print("ok", p, len(d["description"]), "chars")
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              if os.path.exists(p):
                  json.load(open(p)); print("ok", p)
          if not skills:
              print("no skill yet: nothing to check (the skill comes after the plan)")
          PY
      - name: Agent Skills validator (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls skills/*/SKILL.md >/dev/null 2>&1; then
            echo "no skill yet: the validator runs from the first pull request that adds one"
          elif gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "::error::this runner's gh has no 'skill' command, so the Agent Skills validator did not run (rule: it is a gate, never a warning)"
            exit 1
          fi
